# ─────────────────────────────────────────────────────────────────────────────
# PlanSync — Release APK
#
# Run this manually from the Actions tab when you are ready to publish.
# You type the version number (e.g. 1.2) and optional release notes.
# It builds a fresh APK and creates a GitHub Release with that version.
# ─────────────────────────────────────────────────────────────────────────────

name: Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0, 1.1, 2.0)'
        required: true
        default: '1.0'
      release_notes:
        description: 'What changed in this release? (shown to users)'
        required: false
        default: 'Bug fixes and improvements.'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 --decode > app/keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Use a fixed large base so version codes always go up
          # e.g. version 1.2 → 10200, version 2.0 → 20000
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease

      - name: Rename APK with version
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/PlanSync-v${{ github.event.inputs.version }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: PlanSync v${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.release_notes }}
          files: app/build/outputs/apk/release/PlanSync-v${{ github.event.inputs.version }}.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
