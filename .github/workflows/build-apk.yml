name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [web-updated]

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Auto-retry up to 3 times on failure
    strategy:
      max-parallel: 1
      matrix:
        attempt: [1]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (no cache to avoid flaky cancellations)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 --decode > app/keystore.jks

      - name: Verify keystore
        run: |
          keytool -list \
            -keystore app/keystore.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}"

      - name: Build release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/PlanSync-v${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlanSync-APK
          path: app/build/outputs/apk/release/PlanSync-v${{ github.run_number }}.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: PlanSync v${{ github.run_number }}
          body: |
            Auto-built from latest web update.
            Install or update using the APK below.
          files: app/build/outputs/apk/release/PlanSync-v${{ github.run_number }}.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  retry-on-failure:
    name: Retry if failed
    runs-on: ubuntu-latest
    needs: build
    if: failure()
    permissions:
      contents: write
      actions: write

    steps:
      - name: Re-trigger this workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-apk.yml/dispatches \
            -d '{"ref":"main"}'
