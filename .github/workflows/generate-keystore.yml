name: Generate Keystore (run once)

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias'
        required: true
        default: 'plansync'
      keystore_password:
        description: 'Keystore password (save this!)'
        required: true
      key_password:
        description: 'Key password (save this!)'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore plansync.jks \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=PlanSync, OU=Android, O=PlanSync, L=Unknown, S=Unknown, C=US"
          echo "Keystore size: $(wc -c < plansync.jks) bytes"

      - name: Print base64 (copy this into KEYSTORE_BASE64 secret)
        run: |
          echo "==== COPY EVERYTHING BETWEEN THE MARKERS ===="
          base64 -w 0 plansync.jks
          echo ""
          echo "==== END ===="

      - name: Upload keystore file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: plansync.jks
          retention-days: 1
