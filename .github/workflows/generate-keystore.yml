name: Generate Keystore (run once)

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias (e.g. plansync)'
        required: true
        default: 'plansync'
      keystore_password:
        description: 'Keystore password (save this!)'
        required: true
      key_password:
        description: 'Key password (save this!)'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore plansync.jks \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=PlanSync, OU=Android, O=PlanSync, L=Unknown, S=Unknown, C=US"

      # -w 0 disables line wrapping — this is critical for GitHub Secrets
      - name: Encode as single-line base64
        run: base64 -w 0 plansync.jks > plansync_base64.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            plansync.jks
            plansync_base64.txt
          retention-days: 1
