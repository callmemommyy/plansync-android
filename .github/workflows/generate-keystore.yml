name: Generate Keystore (run once)

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias (e.g. plansync)'
        required: true
        default: 'plansync'
      keystore_password:
        description: 'Keystore password (save this!)'
        required: true
      key_password:
        description: 'Key password (save this!)'
        required: true
      owner_name:
        description: 'Your name or org'
        required: true
        default: 'PlanSync'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore plansync.jks \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=${{ github.event.inputs.owner_name }}, OU=Android, O=${{ github.event.inputs.owner_name }}, L=Unknown, S=Unknown, C=US"

      - name: Encode as base64
        run: base64 -w 0 plansync.jks > plansync_base64.txt

      - name: Upload keystore files
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            plansync.jks
            plansync_base64.txt
          retention-days: 1
