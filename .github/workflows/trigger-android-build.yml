name: Trigger Android Build

on:
  push:
    branches: [main]

jobs:
  trigger:
    name: Notify Android repo
    runs-on: ubuntu-latest

    steps:
      - name: Trigger plansync-android build
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.ANDROID_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/callmemommyy/plansync-android/dispatches \
            -d '{"event_type":"web-updated"}'
